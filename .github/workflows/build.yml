name: Build ROM

on:
  push:
    branches: [ main, master ]
    paths: 
      - 'src/**'
  pull_request:
    branches: [ main, master ]
    paths: 
      - 'src/**'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install ACME cross-assembler
      run: |
        sudo apt-get update
        sudo apt-get install -y acme
        acme --version || echo "ACME installed successfully"
    
    - name: Build ROM
      run: |
        cd src
        make all
        ls -la bin/
        test -f bin/parobek-via.bin
        test -f bin/parobek-cpld.bin
    
    - name: Upload VIA ROM
      uses: actions/upload-artifact@v4
      with:
        name: parobek-via
        path: src/bin/parobek-via.bin
        retention-days: 30

    - name: Upload CPLD ROM
      uses: actions/upload-artifact@v4
      with:
        name: parobek-cpld
        path: src/bin/parobek-cpld.bin
        retention-days: 30
